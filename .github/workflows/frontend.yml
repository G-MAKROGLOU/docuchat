name: frontend

on:
  push:
    branches: [main]
    # backend/contract is the source of the generated types, so a contract change runs this too.
    paths: ["frontend/**", "backend/contract/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/contract/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Contract types match backend/contract
        run: npm run contract:check
      - name: Build
        run: npm run build
