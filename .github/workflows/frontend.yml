name: frontend

on:
  push:
    branches: [main]
    # backend/contract is the source of the generated types, so a contract change runs this too.
    paths: ["frontend/**", "backend/contract/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "backend/contract/**", ".github/workflows/frontend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Contract types match backend/contract
        run: npm run contract:check
      - name: Build
        run: npm run build

  image:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the prod image
        run: docker build --target prod -t "ghcr.io/${GITHUB_REPOSITORY,,}/frontend:$GITHUB_SHA" .
      - name: Push to GHCR (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/frontend"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$image:$GITHUB_SHA" "$image:latest"
          docker push --all-tags "$image"

  # PLACEHOLDER: deploy. Target: pull ghcr.io/<owner>/docuchat/frontend:<sha> into the
  # dev environment, set BACKEND_URL to the dev backend, and roll the frontend service.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - name: Placeholder
        run: echo "No deployment target configured."
