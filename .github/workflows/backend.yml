name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      # S3 emulator, so the shared DocumentStore suite also runs against the S3 adapter.
      storage:
        image: chrislusf/seaweedfs:4.52
        env:
          AWS_ACCESS_KEY_ID: ci-access
          AWS_SECRET_ACCESS_KEY: ci-secret
        ports: ["8333:8333"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:8333/healthz"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # ParadeDB, so the repository and search tests run against pg_search and pgvector.
      db:
        image: paradedb/paradedb:0.26.8-pg18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Redis, so the shared cache adapter runs against a real server.
      cache:
        image: redis:7.2.17-alpine3.22
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      CACHE_TEST_URL: redis://localhost:6379/1
      S3_TEST_ENDPOINT_URL: http://localhost:8333
      S3_TEST_ACCESS_KEY: ci-access
      S3_TEST_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.13.18"
          enable-cache: true
          working-directory: backend
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Mypy
        run: uv run --frozen mypy
      - name: Pytest
        run: uv run --frozen pytest -rs
      - name: Bandit
        run: uv run --frozen bandit -c pyproject.toml -r app
      - name: Contract is up to date
        run: uv run --frozen python -m app.api.contract --check
