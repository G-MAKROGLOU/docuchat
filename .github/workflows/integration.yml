name: integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create .env with placeholder values
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^OPENROUTER_API_KEY=$/OPENROUTER_API_KEY=ci-placeholder/' \
            -e 's#^LLM_REWRITE_MODEL=$#LLM_REWRITE_MODEL=ci/rewrite#' \
            -e 's#^LLM_GRADE_MODEL=$#LLM_GRADE_MODEL=ci/grade#' \
            -e 's#^LLM_GENERATE_MODEL=$#LLM_GENERATE_MODEL=ci/generate#' \
            -e 's/^NEXT_WATCH_POLL_INTERVAL_MS=.*/NEXT_WATCH_POLL_INTERVAL_MS=/' \
            -e 's/^WATCHPACK_POLLING=.*/WATCHPACK_POLLING=/' \
            .env
      - name: Start the stack and wait for health
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: GET /api/v1/health on the backend
        run: curl -fsS http://localhost:8000/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
      - name: GET /api/v1/health through the frontend proxy
        run: curl -fsS http://localhost:3000/api/v1/health | grep -q '"status":"ok"'
      # PLACEHOLDER: question test. Send one question to POST /api/v1/chat and assert that
      # the stream ends with a `final` or a `refusal` event.
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
